# DigiProjects Unified Configuration for digiprojects.co.ke
# Frontend + Backend API on single domain
# File: /etc/nginx/sites-available/digiprojects

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name digiprojects.co.ke www.digiprojects.co.ke;
    return 301 https://$server_name$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name digiprojects.co.ke www.digiprojects.co.ke;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/digiprojects.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digiprojects.co.ke/privkey.pem;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_vary on;

    # ====================================================================
    # FRONTEND ROUTES (Vue.js SPA)
    # ====================================================================
    
    # Frontend static files
    root /var/www/digiprojects/digiprojects-frontend/dist;
    index index.html;

    # Cache static assets (js, css, images, fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Frontend SPA routing - serve index.html for all non-API routes
    location ~ ^/(?!api/) {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ====================================================================
    # BACKEND API ROUTES (/api/*)
    # ====================================================================
    
    # API Location Block
    location /api/ {
        # Change root to backend public directory
        root /var/www/digiprojects/digiprojects-backend/public;
        
        # Laravel routing - pass all requests to index.php
        try_files $uri $uri/ /index.php?$query_string;
        
        # PHP-FPM handler for API requests
        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/digiprojects/digiprojects-backend/public$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_SCHEME https;
        }
    }

    # ====================================================================
    # SECURITY & OPTIMIZATION
    # ====================================================================
    
    # Deny access to hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
