# Backend API Nginx Configuration
# File: /etc/nginx/sites-available/digiprojects-api

server {
    listen 80;
    listen [::]:80;
    server_name api.digiprojects.co.ke;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.digiprojects.co.ke;

    # SSL Certificate paths (update with your Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/api.digiprojects.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.digiprojects.co.ke/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Backend root directory
    root /var/www/digiprojects/digiprojects-backend/public;
    index index.php;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    # Laravel routing
    location / {
        # Handle preflight CORS
        if ($request_method = 'OPTIONS') {
            if ($http_origin ~* "^(https?://(localhost:(5173|3000)|127\.0\.0\.1:5173))$") {
                add_header 'Access-Control-Allow-Origin' $http_origin always;
            }
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,X-Requested-With,X-CSRF-TOKEN' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            return 204;
        }

        try_files $uri $uri/ /index.php?$query_string;

        # Add CORS headers to responses
        if ($http_origin ~* "^(https?://(localhost:(5173|3000)|127\.0\.0\.1:5173))$") {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
        }
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,X-Requested-With,X-CSRF-TOKEN' always;
    }

    # PHP-FPM handler
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_SCHEME https;
    }

    # Deny access to hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }

    # Performance: cache busting for assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
